name: verify-public-reference

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.3"
          enable-cache: false
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      - run: uv run python scripts/test_publication_scan.py
      - run: uv run python scripts/test_package_proof.py
      - run: uv run python scripts/publication_scan.py
      - run: uv build
      - run: uv run python scripts/package_proof.py
